spring.application.name=controle-estoque
server.port=${PORT:8080}

# Banco: por padrao usa H2 em arquivo (roda sem instalar nada).
# No deploy, basta definir DB_URL, DB_USER e DB_PASSWORD para usar PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/estoque}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# Swagger: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
